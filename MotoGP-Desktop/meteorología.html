    <main>
        <h2>Información sobre la meteorología</h2>

        <section id="infoCiudad">
            <h3>Información sobre la ciudad</h3>
        </section>
    </main>

    <section id="meteoCarrera"></section>
    <section id="meteoEntrenos"></section>

    <script>
        const ciudadCarrera = new Ciudad("Spielberg", "Austria", "austriaco");

        ciudadCarrera.initializeGeo(5400, "47°13′12″N, 14°45′54″E");

        const contenedor = document.getElementById("infoCiudad");

        const pCiudad = document.createElement("p");
        pCiudad.innerHTML = `Ciudad: ${ciudadCarrera.cityToString()}`;
        contenedor.appendChild(pCiudad);

        const pPais = document.createElement("p");
        pPais.innerHTML = `País: ${ciudadCarrera.countryToString()}`;
        contenedor.appendChild(pPais);

        const secInfo = document.createElement("section");
        secInfo.innerHTML = ciudadCarrera.buildDemographicInfo();
        contenedor.appendChild(secInfo);

        ciudadCarrera.writeCoordinates();

        ciudadCarrera.getMeteorologiaCarrera("2025-08-17");

        ciudadCarrera.getMeteorologiaEntrenos(["2025-08-14", "2025-08-15", "2025-08-16"]);
    </script>
